# Copy this file into a NEW repo (e.g. spywellinfotech-sys/livecard) as .github/workflows/deploy.yml
# Pages setting in that repo: Source = GitHub Actions, Custom domain = livecard.in
name: Deploy livecard.in

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spywellinfotech-sys/SpyWell-InfoTech-website
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build
        env:
          VITE_SITE_URL: https://livecard.in
        run: npm run build -- --base=/ && node scripts/make404.cjs
      - name: Per-card link previews
        continue-on-error: true
        env:
          SITE_ORIGIN: https://livecard.in
        run: node scripts/make-og-pages.cjs
      - name: Card screenshots for link previews
        continue-on-error: true
        timeout-minutes: 6
        env:
          SITE_ORIGIN: https://livecard.in
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/make-og-shots.cjs
      - name: livecard.in home page
        run: |
          cp -r dist/dyname/. dist/
          cp dist/dyname/index.html dist/index.html
          grep -rIl '/dyname/' dist --include=*.html --include=*.js --include=*.webmanifest --include=*.json | grep -v '^dist/dyname/' | xargs -r sed -i 's#/dyname/#/#g'
          sed -i 's#https://spywell.in/dyname/#https://livecard.in/#g; s#https://spywell.in/dyname/og.jpg#https://livecard.in/dyname/og.jpg#g' dist/index.html
          rm -rf dist/dyname
          python3 - <<'PY'
          import re
          h=open('dist/404.html',encoding='utf8').read()
          m=re.search(r'<head[^>]*>(<script>.*?</script>)',h,re.S)
          rd=m.group(1) if m else ''
          page='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+rd+'<title>Page not found | LiveCard</title><meta name="robots" content="noindex"><link rel="icon" href="/logo.png"><style>body{margin:0;font:16px system-ui,sans-serif;background:#fff;color:#1a1a1a;text-align:center}header{background:#ED1C24;padding:12px;color:#fff;font-weight:800;font-size:20px}h1{font-size:90px;margin:70px 0 0;color:#ED1C24}p{color:#666}a{display:inline-block;margin-top:18px;background:#ED1C24;color:#fff;text-decoration:none;font-weight:800;padding:12px 28px;border-radius:999px}</style></head><body><header>LiveCard</header><h1>404</h1><h2>Page not found</h2><p>The page you are looking for does not exist or has moved.</p><a href="/">Back to home</a></body></html>'
          open('dist/404.html','w',encoding='utf8').write(page)
          PY
          echo "livecard.in" > dist/CNAME
          printf 'User-agent: *\nAllow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
